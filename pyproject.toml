[project]
name = "research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wangkai", email = "15281818813@163.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
research-agent = "research_agent:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.13"
typeCheckingMode = "basic"